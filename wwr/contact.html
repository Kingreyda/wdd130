<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Rush Rafting | Contact Us</title>
    <meta name="description"
      content="Contact Rapid Rush Rafting for trip information, reservations, questions, and customer support.">
    <meta name="author" content="King David Olaribigbe">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <div class="all-header">
            <img src="images/logo.jpeg" alt="Rapid Rush Rafting company logo">

            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="contact-info">
            <h1>Contact Us</h1>

            <p><strong>Address:</strong> 123 River Drive, Rapid City</p>
            <p><strong>Phone:</strong> +234 800 123 4567</p>
            <p><strong>Email:</strong> info@rapidrushrafting.com</p>
        </section>

        <section class="contact-container">

            <div class="map">
                <iframe src="https://www.google.com/maps?q=Lagos,Nigeria&output=embed" width="100%"
                  height="300"></iframe>
            </div>

            <form>
                <label for="fullname">Name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <p>Message Purpose</p>

                <label>
                    <input type="radio" name="purpose" value="general">
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <label>
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>

        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/river-rescue-experience.jpg">
                <figcaption>Lead River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/half-day-adventure.webp">
                <figcaption>Operations manager</figcaption>
            </figure>

            <figure>
                <img src="images/thunder-rapids.jpg">
                <figcaption>Customer Relations Team</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 Rapid Rush Rafting | King David Olaribigbe
        </p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.png" alt="Facebook social media icon">
            </a>

            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.png" alt="LinkedIn social media icon">
            </a>

            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.png" alt="Instagram social media icon">
            </a>
        </nav>
    </footer>
</body>

</html>
